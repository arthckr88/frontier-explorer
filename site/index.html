<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Frontier Route Explorer</title>
    <meta name="description" content="Frontier public booking observations on a map. Search an origin, destination, and date." />
    <link rel="stylesheet" href="maplibre-gl.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Frontier booking observation map"></div>
    <section class="sheet" aria-label="Search">
      <header class="sheet-head">
        <p class="mark">Frontier</p>
        <h1>Route Explorer</h1>
        <p id="provenance" class="provenance"></p>
      </header>
      <div class="starts" role="group" aria-label="Views">
        <button type="button" id="home-view" aria-pressed="true">Home</button>
        <button type="button" id="socal-view">Bay to SoCal</button>
        <button type="button" id="changes-view">Changes</button>
        <button type="button" id="full-network">Full network</button>
      </div>
      <div class="starts" role="group" aria-label="Starting airport">
        <button type="button" data-origin="SFO">SFO</button>
        <button type="button" data-origin="OAK">OAK</button>
        <button type="button" data-origin="LAS">LAS</button>
        <button type="button" id="new-york">New York</button>
      </div>
      <form id="search">
        <label class="field">
          From
          <input name="from" type="text" autocomplete="off" spellcheck="false" placeholder="City or code" aria-label="From" aria-autocomplete="list" aria-controls="from-list" enterkeyhint="next" />
          <ul id="from-list" class="suggest" role="listbox" hidden></ul>
        </label>
        <label class="field">
          To
          <input name="to" type="text" autocomplete="off" spellcheck="false" placeholder="City or code" aria-label="To" aria-autocomplete="list" aria-controls="to-list" enterkeyhint="search" />
          <ul id="to-list" class="suggest" role="listbox" hidden></ul>
        </label>
        <label class="field">
          From region
          <select name="from-region" aria-label="From region">
            <option value="any" selected>Any</option>
            <option value="united_states">United States</option>
            <option value="west">West</option>
            <option value="midwest">Midwest</option>
            <option value="south">South</option>
            <option value="northeast">Northeast</option>
            <option value="east" title="Northeast, South, and Florida">East</option>
            <option value="florida">Florida</option>
            <option value="mexico">Mexico</option>
            <option value="caribbean">Caribbean</option>
            <option value="central_america">Central America</option>
          </select>
        </label>
        <label class="field">
          To region
          <select name="to-region" aria-label="To region">
            <option value="any" selected>Any</option>
            <option value="united_states">United States</option>
            <option value="west">West</option>
            <option value="midwest">Midwest</option>
            <option value="south">South</option>
            <option value="northeast">Northeast</option>
            <option value="east" title="Northeast, South, and Florida">East</option>
            <option value="florida">Florida</option>
            <option value="mexico">Mexico</option>
            <option value="caribbean">Caribbean</option>
            <option value="central_america">Central America</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit">Search</button>
          <button id="network-toggle" type="button" hidden aria-pressed="false">Show network</button>
          <button id="clear" type="button" hidden>Clear</button>
        </div>
      </form>
      <div class="sheet-results">
        <p id="status" role="status"></p>
        <button id="show-overnight" type="button" hidden>Show overnight flights</button>
        <div id="results"></div>
      </div>
    </section>
    <div class="map-tools">
      <div class="when">
        <label class="field">
          Date
          <input name="date" form="search" type="date" required aria-label="Date" />
        </label>
        <div id="route-calendar" class="calendar" hidden>
          <div class="cal-nav">
            <button type="button" id="cal-prev" aria-label="Previous month">‹</button>
            <p id="cal-label"></p>
            <button type="button" id="cal-next" aria-label="Next month">›</button>
          </div>
          <div id="cal-months" class="cal-months"></div>
          <div id="cal-grid" class="cal-grid"></div>
          <p id="cal-source" class="cal-source"></p>
        </div>
      </div>
      <div id="filters" class="filter-row">
        <label class="field">
          Stops
          <select name="stops" form="search" aria-label="Stops">
            <option value="0" selected>Nonstop only</option>
            <option value="1">Up to 1 stop</option>
            <option value="2">Up to 2 stops</option>
          </select>
        </label>
        <label class="field">
          Duration
          <select name="duration" form="search" aria-label="Duration">
            <option value="" selected>Any</option>
            <option value="300">Under 5 hours</option>
            <option value="480">Under 8 hours</option>
            <option value="720">Under 12 hours</option>
          </select>
        </label>
        <label class="field">
          Departure
          <select name="depart" form="search" aria-label="Departure time">
            <option value="" selected>Any</option>
            <option value="morning">Morning (5 AM–12 PM)</option>
            <option value="afternoon">Afternoon (12–5 PM)</option>
            <option value="evening">Evening (5–10 PM)</option>
          </select>
        </label>
        <label class="field">
          Arrival
          <select name="arrive" form="search" aria-label="Arrival time">
            <option value="" selected>Any</option>
            <option value="morning">Morning (5 AM–12 PM)</option>
            <option value="afternoon">Afternoon (12–5 PM)</option>
            <option value="evening">Evening (5–10 PM)</option>
          </select>
        </label>
        <label class="field">
          Layover
          <select name="layover" form="search" aria-label="Layover">
            <option value="" selected>Any</option>
            <option value="120">Under 2 hours</option>
            <option value="240">Under 4 hours</option>
            <option value="480">Under 8 hours</option>
          </select>
        </label>
        <label class="field">
          Connecting airport
          <input name="hub" form="search" type="text" autocomplete="off" spellcheck="false" placeholder="Any" aria-label="Connecting airport" aria-autocomplete="list" aria-controls="hub-list" />
          <ul id="hub-list" class="suggest" role="listbox" hidden></ul>
        </label>
        <label class="field">
          Sort
          <select name="sort" form="search" aria-label="Sort">
            <option value="stops" selected>Fewest stops</option>
            <option value="duration">Shortest trip</option>
            <option value="depart">Earliest departure</option>
          </select>
        </label>
        <label class="switch">
          <input name="redeye" form="search" type="checkbox" checked role="switch" />
          <span>Exclude red-eyes</span>
        </label>
      </div>
    </div>
    <div class="dock">
      <aside id="airport" class="airport" hidden></aside>
      <aside class="legend" aria-label="Legend">
        <div><span class="swatch scheduled"></span> Near-term nonstop</div>
        <div><span class="swatch future"></span> Future only</div>
        <div><span class="swatch selected"></span> Selected path</div>
        <div><span class="swatch node"></span> Airport</div>
      </aside>
    </div>
    <script>
      window.addEventListener("error", (event) => {
        const note = document.querySelector("#status");
        if (note && !note.textContent) note.textContent = event.message || "The page script failed.";
      });
    </script>
    <script type="module" src="app.js"></script>
    <noscript>The map and search need JavaScript to read the published schedule.</noscript>
  </body>
</html>
