<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Frontier Route Explorer</title>
    <meta name="description" content="Published Frontier routes on a map. Search an origin, destination, and date." />
    <link rel="stylesheet" href="maplibre-gl.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Published Frontier route map"></div>
    <section class="sheet" aria-label="Search">
      <header class="sheet-head">
        <p class="mark">Frontier</p>
        <h1>Route Explorer</h1>
        <p id="network" class="network"></p>
      </header>
      <div class="starts" role="group" aria-label="Starting airport">
        <button type="button" data-origin="SFO">SFO</button>
        <button type="button" data-origin="OAK">OAK</button>
        <button type="button" data-origin="LAS">LAS</button>
        <button type="button" id="new-york">New York</button>
      </div>
      <form id="search">
        <label class="field">
          From
          <input name="from" type="text" autocomplete="off" spellcheck="false" placeholder="City or code" aria-label="From" aria-autocomplete="list" aria-controls="from-list" enterkeyhint="next" />
          <ul id="from-list" class="suggest" role="listbox" hidden></ul>
        </label>
        <label class="field">
          To
          <input name="to" type="text" autocomplete="off" spellcheck="false" placeholder="City or code" aria-label="To" aria-autocomplete="list" aria-controls="to-list" enterkeyhint="search" />
          <ul id="to-list" class="suggest" role="listbox" hidden></ul>
        </label>
        <label class="field span">
          Date
          <input name="date" type="date" required aria-label="Date" />
        </label>
        <label class="field">
          Stops
          <select name="stops" aria-label="Stops">
            <option value="0">Nonstop only</option>
            <option value="1">Up to 1 stop</option>
            <option value="2" selected>Up to 2 stops</option>
          </select>
        </label>
        <label class="field">
          Sort
          <select name="sort" aria-label="Sort">
            <option value="stops" selected>Fewest stops</option>
            <option value="duration">Shortest trip</option>
            <option value="depart">Earliest departure</option>
          </select>
        </label>
        <label class="switch span">
          <input name="redeye" type="checkbox" checked role="switch" />
          <span>Exclude red-eyes</span>
        </label>
        <button type="submit">Search</button>
      </form>
      <p id="status" role="status"></p>
      <button id="show-overnight" type="button" hidden>Show overnight flights</button>
      <div id="results"></div>
    </section>
    <div class="dock">
      <aside id="airport" class="airport" hidden></aside>
      <aside class="legend" aria-label="Legend">
        <div><span class="swatch route"></span> Listed route</div>
        <div><span class="swatch scheduled"></span> Saved times</div>
        <div><span class="swatch selected"></span> Selected path</div>
        <div><span class="swatch node"></span> Airport</div>
      </aside>
    </div>
    <script>
      window.addEventListener("error", (event) => {
        const note = document.querySelector("#status");
        if (note && !note.textContent) note.textContent = event.message || "The page script failed.";
      });
    </script>
    <script type="module" src="app.js"></script>
    <noscript>The map and search need JavaScript to read the published schedule.</noscript>
  </body>
</html>
