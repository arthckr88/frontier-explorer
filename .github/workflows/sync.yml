name: Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Update booking observations
        run: npm run update:published
        env:
          PUBLIC_SCHEDULE_CONCURRENCY: "4"
      - name: Normalize observations, summaries, and route changes
        run: npm run normalize:network
      - name: Check integrity
        run: npm run check:integrity
      - name: Test
        run: npm test
      - name: Build site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "1"
      - name: Commit booking artifacts
        run: |
          git config user.name "schedule-sync"
          git config user.email "schedule-sync@users.noreply.github.com"
          git add data/flights.json data/network.json data/route-summaries.json data/route-changes.json data/diagnostics.json
          if git diff --cached --quiet; then
            echo "No schedule changes"
          else
            git commit -m "Update published Frontier flights"
            git push
          fi
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
