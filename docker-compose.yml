services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
      POSTGRES_DB: frontier
    ports:
      - "5432:5432"
    volumes:
      - frontier_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontier_pg:
